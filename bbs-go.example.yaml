Port: 8082 # 端口
AllowedOrigins:
  - "*"
Installed: false # 是否已完成安装

# 数据下载 https://github.com/lionsoul2014/ip2region/tree/master/data
IPLocator:
  IPv4DataPath: # IPv4 数据文件（建议使用 ip2region_v4.xdb）
  IPv6DataPath: # IPv6 数据文件（建议使用 ip2region_v6.xdb）

# ID 编解码秘钥（安装时自动生成）
IdCodec:
  Key: 0

# 日志配置
Logger:
  Filename: /data/logs/bbs-go.log   # 日志文件的位置
  MaxSize: 100                      # 文件最大尺寸（以MB为单位）
  MaxAge: 10                        # 保留旧文件的最大天数
  MaxBackups: 10                    # 保留的最大旧文件数量

# 数据库连接
DB:
  Type: postgres
  Url: postgres://username:password@127.0.0.1:5432/bbsgo_db?sslmode=disable
  MaxIdleConns: 50
  MaxOpenConns: 200

# search
Search:
  IndexPath: # 索引路径

# 百度SEO相关配置
# 文档：https://ziyuan.baidu.com/college/courseinfo?id=267&page=2#h2_article_title14
BaiduSEO:
  Site:
  Token:

# 神马搜索SEO相关
# 文档：https://zhanzhang.sm.cn/open/mip
SmSEO:
  Site:
  UserName:
  Token:

# Football-Data.org
footballData:
  apiKey: "YOUR_FOOTBALL_DATA_API_KEY"
  competitionCode: "WC"
  season: 2026
  cronSpec: "0 */6 * * *"                       # 5字段 cron：分 时 日 月 周；留空默认 */30 * * * *

# Polymarket Gamma API（只读同步；Discovery 发现 + Tracking 精确跟踪）
polymarket:
  enabled: true
  baseURL: "https://gamma-api.polymarket.com"   # 可省略，留空走默认 Gamma API
  cronSpec: ""                                  # 兼容旧配置；discoveryCron 为空时作为 Discovery cron
  discoveryCron: "*/30 * * * *"                 # 发现新市场；5字段 cron
  trackingCron: "*/5 * * * *"                   # 跟踪已发现市场状态；5字段 cron
  trackingBatchSize: 5                         # 每个标签每次 Discovery 拉取数量 + 每次 Tracking 批量处理数量
  maxRetry: 5                                   # Tracking 连续失败阈值，默认 5
  retryBaseSeconds: 60                          # 失败退避基数；第 N 次失败延后 60*N 秒
  autoSettleEnabled: true                       # 是否允许自动写入站内 SETTLED/result，默认 true
  dryRun: false                                 # true 时只同步/记录问题，不真正自动结算

# DeepSeek API（服务端调用；生产环境建议通过 DEEPSEEK_API_KEY 注入密钥）
deepseek:
  enabled: false
  baseURL: "https://api.deepseek.com"
  apiKey: ""
  defaultModel: "deepseek-v4-flash"
  reasoningModel: "deepseek-v4-pro"
  timeoutSeconds: 120
  maxRetries: 2

# AI 聊天
aiChat:
  enabled: false
  defaultStaminaCost: 1
  defaultMaxStamina: 5
  staminaRecoverMinutes: 60
  appleCoinCost: 5
  maxInputChars: 500
  maxHistoryMessages: 8
  dailyUserMessageLimit: 50
  idlePushCooldownMinutes: 120
  idlePushDailyLimit: 2
  idleTriggerMinutes: 10

# login captcha
loginCaptcha:
  rotateEnabled: true
  # 当 rotateEnabled=false 时：是否同时跳过登录/注册/找回/短信发码等验证码校验（用户名密码通过即登录）
  # 注意：关闭该项则仍可能要求字符验证码（captchaProtocol!=2）
  disableAllWhenRotateOff: false
