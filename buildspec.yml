version: 0.2

phases:
  build:
    commands:
      # 生成 EC2 上运行的 Linux 二进制。
      - make buildlinux

artifacts:
  files:
    # EC2 Deploy 动作需要在 artifact 根目录找到 deployspec.yml。
    - deployspec.yml
    # DeploySpec 中引用的生命周期脚本也必须进入 artifact。
    - scripts/**/*
    # 服务启动文件。
    - bbs-go-linux
    # 首次部署时用于生成 bbs-go.yaml，不会覆盖已有生产配置。
    - bbs-go.example.yaml
    # 运行时静态资源和多语言配置。
    - admin/**/*
    - site/**/*
    - locales/**/*
    - res/**/*
