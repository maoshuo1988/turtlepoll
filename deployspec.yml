version: 0.1

# 将流水线产物中的运行文件复制到 EC2 上的应用目录。
files:
  - source: bbs-go-linux
    destination: /srv/project/turtlepoll
  - source: bbs-go.example.yaml
    destination: /srv/project/turtlepoll
  - source: admin
    destination: /srv/project/turtlepoll/admin
  - source: site
    destination: /srv/project/turtlepoll/site
  - source: locales
    destination: /srv/project/turtlepoll/locales
  - source: res
    destination: /srv/project/turtlepoll/res
  - source: deployspec.yml
    destination: /srv/project/turtlepoll
  - source: scripts
    destination: /srv/project/turtlepoll/scripts

# EC2 Deploy 动作会按阶段执行这些脚本。
scripts:
  # 部署前：准备目录，并尽量停止旧的 systemd 服务。
  BeforeDeploy:
    - location: scripts/before_deploy.sh
      timeout: 300
      runas: root
  # 部署后：整理二进制、保留生产配置，并通过 systemd 启动/重启服务。
  AfterDeploy:
    - location: scripts/after_deploy.sh
      timeout: 600
      runas: root
