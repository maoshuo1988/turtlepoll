version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.23
    commands:
      - echo "Fixing go.mod version format..."
      - sed -i 's/go 1.23.0/go 1.23/' go.mod   # 直接替换文件内容
      - cat go.mod  # 验证修改结果
      - echo "Go version fixed"
  
  pre_build:
    commands:
      - echo "Downloading dependencies..."
      - go mod download
  
  build:
    commands:
      - echo "Building application..."
      - make buildlinux   # 直接调用你现有的 Makefile 命令
  
  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - bbs-go-linux       # Makefile 中输出的文件名
